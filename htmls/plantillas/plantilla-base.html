<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantilla base · IA Toolbox</title>
  <!-- Plantilla en blanco con el estilo IA Toolbox. Duplica este archivo y edítalo. -->
  <style>
    :root{--azul:#0067b8;--violeta:#5b2e91;--tinta:#12172b;--gris:#5b6478;--fondo:#f5f7fb;--tarjeta:#fff;--borde:#e6e9f2}
    @media (prefers-color-scheme: dark){:root{--tinta:#eef1f8;--gris:#a9b2c7;--fondo:#0d1017;--tarjeta:#161b26;--borde:#252c3a}}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--fondo);color:var(--tinta);padding:32px;line-height:1.6}
    .wrap{max-width:900px;margin:0 auto}
    .head{background:linear-gradient(135deg,var(--azul),var(--violeta));color:#fff;border-radius:16px;padding:32px;margin-bottom:24px}
    .head h1{font-size:1.8rem}
    .head p{opacity:.9}
    .card{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:24px;margin-bottom:16px}
    .card h2{font-size:1.2rem;margin-bottom:8px}
    a{color:var(--azul)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>Título de tu contenido</h1>
      <p>Un subtítulo breve que explique de qué va.</p>
    </div>

    <div class="card">
      <h2>Sección 1</h2>
      <p>Escribe aquí tu contenido. Duplica estas tarjetas según necesites.</p>
    </div>

    <div class="card">
      <h2>Sección 2</h2>
      <p>Más contenido…</p>
    </div>
  </div>
</body>
</html>
